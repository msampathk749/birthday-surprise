<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday! ❤️</title>
  <!-- Confetti Engine -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f7a8b8;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    /* SCREEN 1: Mobile Poster Background */
    #start-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: url('oggy.bg.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.6s ease;
    }

    /* EXACT POSITIONED ANIMATED GIFT BOX OVERLAY */
    .gift-interactive-wrapper {
      position: absolute;
      top: 57.5%;
      left: 50.5%;
      transform: translate(-50%, -50%);
      width: 145px;
      height: 125px;
      cursor: pointer;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: gentleFloat 2.6s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translate(-50%, -50%) translateY(0) scale(1);
        filter: drop-shadow(0 8px 14px rgba(216, 27, 96, 0.45));
      }
      50% {
        transform: translate(-50%, -50%) translateY(-10px) scale(1.04);
        filter: drop-shadow(0 18px 24px rgba(255, 64, 129, 0.85));
      }
    }

    /* Pulsing Magic Glow Behind the Gift */
    .gift-aura {
      position: absolute;
      width: 160px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.7) 0%, rgba(255, 64, 129, 0.3) 55%, transparent 75%);
      animation: pulseAura 1.8s ease-in-out infinite;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes pulseAura {
      0%, 100% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* Gift Lid + Bow */
    .gift-lid-box {
      position: relative;
      width: 154px;
      height: 38px;
      background: linear-gradient(180deg, #c2185b 0%, #ad1457 100%);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
      z-index: 2;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Lid Yellow Ribbon */
    .gift-lid-box::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 28px;
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffea00, #ffd700);
      box-shadow: inset 0 0 4px rgba(0,0,0,0.15);
    }

    /* Red Ribbon Bow on Lid */
    .gift-bow {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    }

    /* Gift Bottom Body */
    .gift-body-box {
      position: relative;
      width: 136px;
      height: 74px;
      margin-top: -3px;
      background: linear-gradient(180deg, #e91e63 0%, #c2185b 100%);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }

    /* Vertical Ribbon */
    .gift-body-box .ribbon-v {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 28px;
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffea00, #ffd700);
      box-shadow: inset 0 0 4px rgba(0,0,0,0.15);
    }

    /* Horizontal Ribbon */
    .gift-body-box .ribbon-h {
      position: absolute;
      top: 36%;
      left: 0;
      width: 100%;
      height: 24px;
      background: linear-gradient(180deg, #ffd700, #ffea00, #ffd700);
      box-shadow: inset 0 0 4px rgba(0,0,0,0.15);
    }

    /* Gift Opening Keyframe Triggers */
    .gift-interactive-wrapper.opening {
      animation: none !important;
    }

    .gift-interactive-wrapper.opening .gift-lid-box {
      transform: translateY(-90px) rotate(-24deg) scale(1.15);
      opacity: 0;
    }

    .gift-interactive-wrapper.opening .gift-body-box {
      transform: scale(1.1);
      box-shadow: 0 0 45px rgba(255, 215, 0, 0.9), 0 0 30px rgba(255, 64, 129, 0.9);
      transition: all 0.5s ease-out;
    }

    /* Floating background hearts/stars */
    .bg-heart {
      position: fixed;
      bottom: -20px;
      font-size: 22px;
      opacity: 0.75;
      animation: floatUp linear infinite;
      z-index: 5;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-105vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    /* SCREEN 2: Surprise Reveal Card */
    .card-container {
      position: relative;
      z-index: 50;
      width: 90%;
      max-width: 380px;
      margin: auto;
    }

    #surprise-card {
      display: none;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.95);
      animation: zoomIn 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes zoomIn {
      0% { transform: scale(0.3) translateY(60px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .photo-wrapper {
      position: relative;
      width: 100%;
      max-width: 260px;
      margin: 0 auto 14px;
      border-radius: 18px;
      padding: 5px;
      background: linear-gradient(135deg, #ff4081, #ffd700, #ff80ab);
      box-shadow: 0 10px 24px rgba(255, 64, 129, 0.35);
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      max-height: 310px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      background: #fff;
    }

    .recipient-name {
      font-size: 1.55rem;
      color: #c2185b;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .message-box {
      font-size: 0.95rem;
      line-height: 1.55;
      color: #444;
      background: #fff0f5;
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 16px;
      text-align: left;
      white-space: pre-wrap;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, #e91e63, #d81b60);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 11px 22px;
      border-radius: 50px;
      box-shadow: 0 6px 18px rgba(233, 30, 99, 0.35);
      transition: transform 0.2s;
      cursor: pointer;
      border: none;
      margin-bottom: 8px;
    }

    .download-btn:active {
      transform: scale(0.96);
    }

    .signature {
      font-size: 0.98rem;
      color: #ad1457;
      font-weight: 700;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
  </style>
</head>
<body>

  <!-- Background Music -->
  <audio id="birthday-audio" preload="auto" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3?filename=happy-birthday-to-you-110057.mp3" type="audio/mpeg">
  </audio>

  <!-- SCREEN 1: Animated Interactive Gift Box positioned over Poster Box -->
  <div id="start-screen">
    <div class="gift-interactive-wrapper" id="gift-box" onclick="openSurprise()">
      <div class="gift-aura"></div>
      
      <!-- Animated Lid -->
      <div class="gift-lid-box">
        <div class="gift-bow">🎀</div>
      </div>

      <!-- Box Body -->
      <div class="gift-body-box">
        <div class="ribbon-v"></div>
        <div class="ribbon-h"></div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: Reveal Surprise Card -->
  <div class="card-container">
    <div id="surprise-card">
      <div class="photo-wrapper">
        <img id="reveal-image" src="her-photo.jpg" alt="Birthday Special">
      </div>

      <h2 class="recipient-name">Happy Birthday, My Special Person ❤️</h2>

      <div class="message-box" id="typewriter-text"></div>

      <a id="download-link" href="her-photo.jpg" download="birthday-special.jpg" class="download-btn">
        📥 Download Photo
      </a>

      <div class="signature" id="card-signature">With all my love ❤️✨</div>
    </div>
  </div>

  <script>
    const birthdayMessage = "Wishing you a day filled with all the love, happiness, and smiles in the world!\n\nYou are truly special, and I hope this year brings you everything your heart desires. 🎂🎉✨";

    function createHearts() {
      const icons = ['❤️', '💖', '🎈', '✨', '🎂', '🎉', '🌸'];
      for (let i = 0; i < 18; i++) {
        const heart = document.createElement('div');
        heart.className = 'bg-heart';
        heart.innerText = icons[Math.floor(Math.random() * icons.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.animationDelay = (Math.random() * 4) + 's';
        document.body.appendChild(heart);
      }
    }
    createHearts();

    function fireConfetti() {
      const duration = 3.5 * 1000;
      const animationEnd = Date.now() + duration;
      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        confetti({ 
          particleCount: 45, 
          spread: 360, 
          startVelocity: 35, 
          origin: { x: Math.random() * 0.8 + 0.1, y: Math.random() - 0.2 } 
        });
      }, 220);
    }

    function typeMessage(text, elementId, speed = 35) {
      let index = 0;
      const target = document.getElementById(elementId);
      target.textContent = '';
      function type() {
        if (index < text.length) {
          target.textContent += text.charAt(index);
          index++;
          setTimeout(type, speed);
        } else {
          document.getElementById('card-signature').style.opacity = '1';
        }
      }
      type();
    }

    function openSurprise() {
      const giftBox = document.getElementById('gift-box');
      giftBox.classList.add('opening');

      const audio = document.getElementById('birthday-audio');
      if (audio) audio.play().catch(() => {});

      // Burst confetti from the center of the gift box
      confetti({
        particleCount: 80,
        spread: 100,
        origin: { y: 0.58 }
      });

      setTimeout(() => {
        fireConfetti();
        document.getElementById('start-screen').style.opacity = '0';
      }, 450);

      setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
        const card = document.getElementById('surprise-card');
        card.style.display = 'block';
        typeMessage(birthdayMessage, 'typewriter-text', 40);
      }, 900);
    }
  </script>
</body>
</html>
