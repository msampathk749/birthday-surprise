<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! ❤️</title>
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffeef2 0%, #ffd6e5 50%, #fec8d8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
      padding: 20px 10px;
      position: relative;
    }

    /* Animated Cartoon Stickers */
    .cartoon-sticker {
      position: fixed;
      pointer-events: none;
      z-index: 5;
      border-radius: 16px;
      border: 3px solid #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      object-fit: cover;
    }

    /* 1. Cheering Oggy & Cockroaches (Top Right) */
    .char-cheer {
      top: 3%;
      right: 3%;
      width: 150px;
      height: 150px;
      animation: cheerMotion 4s ease-in-out infinite alternate;
    }

    /* 2. Oggy running with Birthday Cake (Bottom Left) */
    .char-cake {
      bottom: 3%;
      left: 3%;
      width: 170px;
      height: 115px;
      animation: cakeMotion 3.2s ease-in-out infinite alternate;
    }

    /* 3. Bob, Olivia & Cockroach stack (Bottom Right) */
    .char-stack {
      bottom: 3%;
      right: 3%;
      width: 125px;
      height: 170px;
      animation: stackMotion 4.2s ease-in-out infinite alternate;
    }

    @keyframes cheerMotion {
      0% { transform: translateY(0) rotate(-3deg) scale(1); }
      100% { transform: translateY(-16px) rotate(4deg) scale(1.05); }
    }

    @keyframes cakeMotion {
      0% { transform: translateX(0) rotate(0deg); }
      50% { transform: translateX(14px) rotate(3deg); }
      100% { transform: translateX(0) rotate(-3deg); }
    }

    @keyframes stackMotion {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-14px) scale(1.04); }
    }

    /* Floating party confetti & hearts */
    .bg-heart {
      position: fixed;
      bottom: -20px;
      font-size: 22px;
      opacity: 0.7;
      animation: floatUp linear infinite;
      z-index: 2;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-110vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: auto;
    }

    /* SCREEN 1: Gift Box */
    #start-screen {
      transition: all 0.5s ease;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(5px);
      padding: 24px 16px;
      border-radius: 24px;
    }

    h1.title {
      font-size: 2.3rem;
      color: #d6336c;
      margin-bottom: 8px;
      text-shadow: 1px 1px 4px rgba(255, 255, 255, 0.8);
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #5e1488;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .gift-container {
      position: relative;
      width: 155px;
      height: 135px;
      margin: 15px auto 25px;
      cursor: pointer;
    }

    .gift-box {
      position: absolute;
      bottom: 0;
      width: 155px;
      height: 108px;
      background: #e91e63;
      border-radius: 0 0 14px 14px;
      box-shadow: 0 12px 28px rgba(233, 30, 99, 0.4);
      position: relative;
    }

    .gift-lid {
      position: absolute;
      top: 0;
      left: -10px;
      width: 175px;
      height: 34px;
      background: #c2185b;
      border-radius: 8px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      z-index: 5;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: left bottom;
    }

    .ribbon-v {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 26px;
      height: 100%;
      background: #ffd700;
    }

    .ribbon-h {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      height: 24px;
      background: #ffd700;
    }

    .bow {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 34px;
    }

    .tap-hint {
      font-size: 1.1rem;
      color: #b71540;
      font-weight: 700;
      animation: bounce 1.4s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* SCREEN 2: Revealed Card */
    #surprise-card {
      display: none;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.15);
      animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes zoomIn {
      0% { transform: scale(0.5) translateY(40px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .photo-wrapper {
      position: relative;
      width: 100%;
      max-width: 290px;
      margin: 0 auto 16px;
      border-radius: 18px;
      padding: 6px;
      background: linear-gradient(135deg, #ff4081, #ffd700, #ff80ab);
      box-shadow: 0 10px 25px rgba(255, 64, 129, 0.3);
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      max-height: 340px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      background: #fff;
    }

    .recipient-name {
      font-size: 1.6rem;
      color: #c2185b;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .message-box {
      font-size: 1rem;
      line-height: 1.6;
      color: #444;
      background: #fff0f5;
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 18px;
      text-align: left;
      white-space: pre-wrap;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #e91e63, #d81b60);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.98rem;
      padding: 12px 24px;
      border-radius: 50px;
      box-shadow: 0 6px 16px rgba(233, 30, 99, 0.35);
      transition: transform 0.2s;
      cursor: pointer;
      border: none;
      margin-bottom: 10px;
    }

    .download-btn:active {
      transform: scale(0.96);
    }

    .signature {
      font-size: 1.05rem;
      color: #ad1457;
      font-weight: 600;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    /* Mobile screen responsive sizes */
    @media (max-width: 650px) {
      .char-cheer { width: 95px; height: 95px; top: 1.5%; right: 1.5%; }
      .char-cake { width: 110px; height: 75px; bottom: 1.5%; left: 1.5%; }
      .char-stack { width: 85px; height: 115px; bottom: 1.5%; right: 1.5%; }
    }
  </style>
</head>
<body>

  <!-- Cartoon Character 1: Cheering Oggy & Cockroaches -->
  <img src="oggy-cheer.jpg" alt="Oggy Cheering" class="cartoon-sticker char-cheer">

  <!-- Cartoon Character 2: Oggy Carrying Birthday Cake -->
  <img src="oggy-cake.jpg" alt="Oggy Cake" class="cartoon-sticker char-cake">

  <!-- Cartoon Character 3: Bob, Olivia & Cockroach Stack -->
  <img src="oggy-stack.jpg" alt="Oggy Stack" class="cartoon-sticker char-stack">

  <!-- Background Music -->
  <audio id="birthday-audio" preload="auto" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3?filename=happy-birthday-to-you-110057.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <!-- Initial Screen: Closed Gift -->
    <div id="start-screen">
      <h1 class="title">Happy Birthday ❤️</h1>
      <p class="subtitle">A special surprise is waiting for you...</p>

      <div class="gift-container" onclick="openSurprise()">
        <div class="gift-lid" id="gift-lid">
          <div class="bow">🎀</div>
          <div class="ribbon-v"></div>
        </div>
        <div class="gift-box">
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
        </div>
      </div>

      <div class="tap-hint">👇 Tap the gift to open it</div>
    </div>

    <!-- Surprise Screen: Photo + Message + Download -->
    <div id="surprise-card">
      <div class="photo-wrapper">
        <img id="reveal-image" src="her-photo.jpg" alt="Birthday Special">
      </div>

      <h2 class="recipient-name">Happy Birthday, My Special Person ❤️</h2>

      <div class="message-box" id="typewriter-text"></div>

      <!-- Instant Download Button -->
      <a id="download-link" href="her-photo.jpg" download="birthday-special.jpg" class="download-btn">
        📥 Download Photo
      </a>

      <div class="signature" id="card-signature">With all my love ❤️✨</div>
    </div>
  </div>

  <script>
    const birthdayMessage = "Wishing you a day filled with all the love, happiness, and smiles in the world!\n\nYou are truly special, and I hope this year brings you everything your heart desires. 🎂🎉✨";

    // Floating background celebration icons
    function createHearts() {
      const icons = ['❤️', '💖', '🎈', '✨', '🎂', '🎉', '🌸'];
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.className = 'bg-heart';
        heart.innerText = icons[Math.floor(Math.random() * icons.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.animationDelay = (Math.random() * 4) + 's';
        document.body.appendChild(heart);
      }
    }
    createHearts();

    // Confetti shower
    function fireConfetti() {
      const duration = 3.5 * 1000;
      const animationEnd = Date.now() + duration;
      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        confetti({ particleCount: 40, spread: 360, startVelocity: 35, origin: { x: Math.random() * 0.8 + 0.1, y: Math.random() - 0.2 } });
      }, 220);
    }

    // Typewriter effect
    function typeMessage(text, elementId, speed = 35) {
      let index = 0;
      const target = document.getElementById(elementId);
      target.textContent = '';
      function type() {
        if (index < text.length) {
          target.textContent += text.charAt(index);
          index++;
          setTimeout(type, speed);
        } else {
          document.getElementById('card-signature').style.opacity = '1';
        }
      }
      type();
    }

    // Gift Opening Transition
    function openSurprise() {
      const audio = document.getElementById('birthday-audio');
      if (audio) audio.play().catch(() => {});

      const lid = document.getElementById('gift-lid');
      lid.style.transform = 'translate(-35px, -70px) rotate(-35deg)';

      fireConfetti();

      setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
        const card = document.getElementById('surprise-card');
        card.style.display = 'block';
        typeMessage(birthdayMessage, 'typewriter-text', 40);
      }, 600);
    }
  </script>
</body>
</html>
