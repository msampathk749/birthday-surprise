<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! ❤️</title>
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffebf3 0%, #ffd6e5 50%, #fec8d8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      text-align: center;
      padding: 20px 10px;
      position: relative;
    }

    /* Animated Oggy cartoon characters */
    .cartoon-char {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15));
    }

    /* Top Right: Cheering Oggy & Cockroaches */
    .char-oggy-cheer {
      top: 2%;
      right: 2%;
      width: 145px;
      animation: cheerFloat 4s ease-in-out infinite alternate;
    }

    /* Bottom Left: Oggy running with the giant cake */
    .char-oggy-cake {
      bottom: 2%;
      left: 1%;
      width: 160px;
      animation: cakeWiggle 3.5s ease-in-out infinite alternate;
    }

    /* Bottom Right: Bob, Olivia & Cockroach stack */
    .char-oggy-stack {
      bottom: 1%;
      right: 2%;
      width: 130px;
      animation: stackBounce 4.5s ease-in-out infinite alternate;
    }

    /* Top Left: Cockroach Joey sneaking in */
    .char-cockroach-corner {
      top: 2%;
      left: 2%;
      width: 85px;
      animation: sneakyFloat 3s ease-in-out infinite alternate;
    }

    @keyframes cheerFloat {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      100% { transform: translateY(-14px) rotate(4deg) scale(1.04); }
    }

    @keyframes cakeWiggle {
      0% { transform: translateX(0) rotate(0deg); }
      50% { transform: translateX(12px) rotate(3deg); }
      100% { transform: translateX(0) rotate(-2deg); }
    }

    @keyframes stackBounce {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-12px) scale(1.03); }
    }

    @keyframes sneakyFloat {
      0% { transform: translateY(0) rotate(-5deg); }
      100% { transform: translateY(10px) rotate(8deg); }
    }

    /* Floating background hearts & party icons */
    .bg-heart {
      position: fixed;
      bottom: -20px;
      font-size: 22px;
      opacity: 0.6;
      animation: floatUp linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0.7; }
      100% { transform: translateY(-110vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: auto;
    }

    /* SCREEN 1: Gift Box */
    #start-screen {
      transition: all 0.5s ease;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(4px);
      padding: 24px 16px;
      border-radius: 24px;
    }

    h1.title {
      font-size: 2.3rem;
      color: #d6336c;
      margin-bottom: 8px;
      text-shadow: 1px 1px 4px rgba(255,255,255,0.8);
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #5e1488;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .gift-container {
      position: relative;
      width: 155px;
      height: 135px;
      margin: 15px auto 25px;
      cursor: pointer;
    }

    .gift-box {
      position: absolute;
      bottom: 0;
      width: 155px;
      height: 108px;
      background: #e91e63;
      border-radius: 0 0 14px 14px;
      box-shadow: 0 12px 28px rgba(233, 30, 99, 0.4);
      position: relative;
    }

    .gift-lid {
      position: absolute;
      top: 0;
      left: -10px;
      width: 175px;
      height: 34px;
      background: #c2185b;
      border-radius: 8px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      z-index: 5;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: left bottom;
    }

    .ribbon-v {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 26px;
      height: 100%;
      background: #ffd700;
    }

    .ribbon-h {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      height: 24px;
      background: #ffd700;
    }

    .bow {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 34px;
    }

    .tap-hint {
      font-size: 1.1rem;
      color: #b71540;
      font-weight: 700;
      animation: bounce 1.4s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* SCREEN 2: Revealed Card */
    #surprise-card {
      display: none;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.15);
      animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes zoomIn {
      0% { transform: scale(0.5) translateY(40px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .photo-wrapper {
      position: relative;
      width: 100%;
      max-width: 290px;
      margin: 0 auto 16px;
      border-radius: 18px;
      padding: 6px;
      background: linear-gradient(135deg, #ff4081, #ffd700, #ff80ab);
      box-shadow: 0 10px 25px rgba(255, 64, 129, 0.3);
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      max-height: 340px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      background: #fff;
    }

    .recipient-name {
      font-size: 1.6rem;
      color: #c2185b;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .message-box {
      font-size: 1rem;
      line-height: 1.6;
      color: #444;
      background: #fff0f5;
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 18px;
      text-align: left;
      white-space: pre-wrap;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #e91e63, #d81b60);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.98rem;
      padding: 12px 24px;
      border-radius: 50px;
      box-shadow: 0 6px 16px rgba(233, 30, 99, 0.35);
      transition: transform 0.2s;
      cursor: pointer;
      border: none;
      margin-bottom: 10px;
    }

    .download-btn:active {
      transform: scale(0.96);
    }

    .signature {
      font-size: 1.05rem;
      color: #ad1457;
      font-weight: 600;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    /* Mobile adjustments for cartoon size */
    @media (max-width: 600px) {
      .char-oggy-cheer { width: 100px; top: 1%; right: 1%; }
      .char-oggy-cake { width: 110px; bottom: 1%; left: 1%; }
      .char-oggy-stack { width: 90px; bottom: 1%; right: 1%; }
      .char-cockroach-corner { width: 60px; top: 1%; left: 1%; }
    }
  </style>
</head>
<body>

  <!-- Cartoon Character 1: Cheering Oggy & Cockroaches (Top Right) -->
  <img src="https://static.wikia.nocookie.net/oggyandthecockroaches/images/3/36/Season_4_poster.png" 
       alt="Oggy Cheering" class="cartoon-char char-oggy-cheer" 
       onerror="this.src='https://assets.stickpng.com/images/580b57fbd9996e24bc43c08f.png'">

  <!-- Cartoon Character 2: Oggy with Birthday Cake (Bottom Left) -->
  <img src="https://static.wikia.nocookie.net/oggyandthecockroaches/images/d/df/Oggy_Birthday_Cake.png" 
       alt="Oggy with Cake" class="cartoon-char char-oggy-cake" 
       onerror="this.src='https://assets.stickpng.com/images/580b57fbd9996e24bc43c08f.png'">

  <!-- Cartoon Character 3: Jack & Bob Stack (Bottom Right) -->
  <img src="https://static.wikia.nocookie.net/oggyandthecockroaches/images/a/a2/Oggy_and_Jack_Stack.png" 
       alt="Oggy Friends" class="cartoon-char char-oggy-stack" 
       onerror="this.src='https://assets.stickpng.com/images/580b57fbd9996e24bc43c090.png'">

  <!-- Cartoon Character 4: Dee Dee / Cockroach (Top Left) -->
  <img src="https://static.wikia.nocookie.net/oggyandthecockroaches/images/4/47/Dee_Dee_art.png" 
       alt="Dee Dee" class="cartoon-char char-cockroach-corner" 
       onerror="this.src='https://assets.stickpng.com/images/580b57fbd9996e24bc43c090.png'">

  <!-- Background Music -->
  <audio id="birthday-audio" preload="auto" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3?filename=happy-birthday-to-you-110057.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <!-- Initial Screen: Closed Gift -->
    <div id="start-screen">
      <h1 class="title">Happy Birthday ❤️</h1>
      <p class="subtitle">A special surprise is waiting for you...</p>

      <div class="gift-container" onclick="openSurprise()">
        <div class="gift-lid" id="gift-lid">
          <div class="bow">🎀</div>
          <div class="ribbon-v"></div>
        </div>
        <div class="gift-box">
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
        </div>
      </div>

      <div class="tap-hint">👇 Tap the gift to open it</div>
    </div>

    <!-- Surprise Screen: Photo + Message + Download -->
    <div id="surprise-card">
      <div class="photo-wrapper">
        <img id="reveal-image" src="her-photo.jpg" alt="Birthday Special" onerror="this.src='https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600'">
      </div>

      <h2 class="recipient-name">Happy Birthday, My Special Person ❤️</h2>

      <div class="message-box" id="typewriter-text"></div>

      <!-- Instant Download Button -->
      <a id="download-link" href="her-photo.jpg" download="birthday-special.jpg" class="download-btn">
        📥 Download Photo
      </a>

      <div class="signature" id="card-signature">With all my love ❤️✨</div>
    </div>
  </div>

  <script>
    const birthdayMessage = "Wishing you a day filled with all the love, happiness, and smiles in the world!\n\nYou are truly special, and I hope this year brings you everything your heart desires. 🎂🎉✨";

    // Floating background hearts & party emojis
    function createHearts() {
      const icons = ['❤️', '💖', '🎈', '✨', '🎂', '🎉'];
      for (let i = 0; i < 18; i++) {
        const heart = document.createElement('div');
        heart.className = 'bg-heart';
        heart.innerText = icons[Math.floor(Math.random() * icons.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.animationDelay = (Math.random() * 4) + 's';
        document.body.appendChild(heart);
      }
    }
    createHearts();

    // Confetti effect
    function fireConfetti() {
      const duration = 3.5 * 1000;
      const animationEnd = Date.now() + duration;
      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        confetti({ particleCount: 40, spread: 360, startVelocity: 35, origin: { x: Math.random() * 0.8 + 0.1, y: Math.random() - 0.2 } });
      }, 220);
    }

    // Typewriter effect
    function typeMessage(text, elementId, speed = 35) {
      let index = 0;
      const target = document.getElementById(elementId);
      target.textContent = '';
      function type() {
        if (index < text.length) {
          target.textContent += text.charAt(index);
          index++;
          setTimeout(type, speed);
        } else {
          document.getElementById('card-signature').style.opacity = '1';
        }
      }
      type();
    }

    // Gift Opening Transition
    function openSurprise() {
      const audio = document.getElementById('birthday-audio');
      if (audio) audio.play().catch(() => {});

      // Pop open the lid
      const lid = document.getElementById('gift-lid');
      lid.style.transform = 'translate(-35px, -70px) rotate(-35deg)';

      fireConfetti();

      // Switch to the full surprise card
      setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
        const card = document.getElementById('surprise-card');
        card.style.display = 'block';
        typeMessage(birthdayMessage, 'typewriter-text', 40);
      }, 600);
    }
  </script>
</body>
</html>
